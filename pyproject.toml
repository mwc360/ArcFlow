[project]
name = "arcflow"
version = "0.1.9"
description = "Zone-agnostic PySpark ELT framework for Microsoft Fabric - architect scalable data flows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "delta-spark>=3.2,<5",
    "fsspec>=2025.9.0",
    "pyspark>=3.5,<5",
    "pyyaml>=6.0",
    "tenacity==9.1.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcflow"]

[tool.uv.sources]
lakegen = { path = "lakegen-0.3.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "lakegen",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
